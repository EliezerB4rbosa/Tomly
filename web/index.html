<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#182b28" />
  <meta name="description" content="TomLy — cifras, escalas e repertórios no ritmo da sua banda." />
  <title>TomLy — música em sintonia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#inicio" aria-label="TomLy início"><span class="brand-mark">t<span>♪</span></span><span>tomly<span class="brand-dot">.</span></span></a>
      <div class="workspace"><div class="workspace-avatar">L</div><div><strong>Louvor & Vida</strong><small>Minha banda</small></div><span class="chevron">⌄</span></div>
      <nav class="side-nav" aria-label="Navegação principal">
        <p class="nav-label">BIBLIOTECA</p>
        <button class="nav-item active" data-page="inicio"><span>⌂</span>Início</button>
        <button class="nav-item" data-page="cifras"><span>♫</span>Cifras <em id="song-count">8</em></button>
        <button class="nav-item" data-page="escalas"><span>♧</span>Escalas</button>
        <button class="nav-item" data-page="repertorio"><span>▤</span>Repertórios</button>
        <p class="nav-label folders-label">PASTAS <button id="new-folder" title="Criar pasta">＋</button></p>
        <div id="folder-list"></div>
      </nav>
      <div class="sidebar-bottom"><div class="help-card"><span>✦</span><div><strong>Feito para tocar junto</strong><small>Seu som, seu jeito.</small></div></div><div class="profile"><div class="profile-avatar">T</div><div><strong>Tom</strong><small>Administrador</small></div><button aria-label="Opções">•••</button></div></div>
    </aside>

    <main class="main-area">
      <header class="topbar"><button class="mobile-menu icon-button" id="menu-toggle" aria-label="Abrir menu">☰</button><div class="breadcrumb"><span>Louvor & Vida</span><b>/</b><strong id="crumb-current">Início</strong></div><div class="top-actions"><button class="icon-button" id="search-focus" aria-label="Buscar">⌕</button><div class="avatar-small">T</div></div></header>
      <div class="page-content" id="page-content"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="Navegação móvel"><button class="active" data-page="inicio"><span>⌂</span>Início</button><button data-page="cifras"><span>♫</span>Cifras</button><button data-page="escalas"><span>♧</span>Escalas</button><button data-page="repertorio"><span>▤</span>Repertório</button></nav>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <div id="auth-root"></div>
  <input type="file" id="hidden-image-input" accept="image/*,.txt,text/plain" hidden />
  <script src="./app.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
